services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scs}
      POSTGRES_DB: ${POSTGRES_DB:-scs_designer}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scs -d scs_designer"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-scs}:${POSTGRES_PASSWORD:-scs}@db:5432/${POSTGRES_DB:-scs_designer}
      CORS_ORIGINS: http://localhost,http://localhost:80
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pgdata:
